<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - AHO Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .logout-container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="mb-6">
            <img src="../img/logonew.png" alt="AHO Logo" class="w-20 h-20 mx-auto">
        </div>
        <h2 class="text-xl font-semibold text-white mb-2">Sedang memproses logout...</h2>
        <p class="text-gray-400 mb-6">Harap tunggu sebentar</p>
        <div class="flex justify-center mb-6">
            <i class="fas fa-circle-notch fa-2x text-blue-500 spinner"></i>
        </div>
        <p class="text-sm text-gray-500">Jika tidak redirect otomatis, <a href="login.html" class="text-blue-400 hover:text-blue-300">klik disini</a></p>
    </div>

    <script>
        // Konfigurasi API
        const API_BASE_URL = 'https://absen.ahoservice.my.id';

        // Fungsi untuk melakukan proses logout
        async function processLogout() {
            try {
                const token = sessionStorage.getItem('logout_token') || localStorage.getItem('admin_token');
                
                if (token) {
                    // Kirim request logout ke server
                    const response = await fetch(`${API_BASE_URL}/api/admin/logout`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        }
                    });

                    // Hapus semua token penyimpanan lokal
                    localStorage.removeItem('admin_token');
                    sessionStorage.removeItem('logout_token');
                }

                // Redirect ke halaman login setelah 2 detik
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                console.error('Logout error:', error);
                // Tetap redirect meskipun ada error
                localStorage.removeItem('admin_token');
                sessionStorage.removeItem('logout_token');
                window.location.href = 'login.html';
            }
        }

        // Jalankan proses logout saat halaman dimuat
        document.addEventListener('DOMContentLoaded', processLogout);
    </script>
</body>
</html>
