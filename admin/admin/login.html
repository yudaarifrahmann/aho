<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin AHO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: #4B5563 #1F2937;
        }
        *::-webkit-scrollbar {
            width: 6px;
        }
        *::-webkit-scrollbar-track {
            background: #1F2937;
        }
        *::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 3px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <!-- Login Container -->
    <div class="w-full max-w-md bg-gray-800 rounded-2xl overflow-hidden border border-gray-700 shadow-xl fade-in">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-center">
            <div class="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-user-shield text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Admin AHO</h1>
            <p class="text-blue-100 mt-1">Sistem Manajemen Absensi</p>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="p-6 space-y-6">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input 
                            type="text" 
                            id="username" 
                            class="w-full pl-10 pr-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none input-focus transition duration-200" 
                            placeholder="Masukkan username"
                            required
                        >
                    </div>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full pl-10 pr-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none input-focus transition duration-200" 
                            placeholder="Masukkan password"
                            required
                        >
                        <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center" id="togglePassword">
                            <i class="fas fa-eye text-gray-400 hover:text-gray-300 cursor-pointer"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600 rounded bg-gray-700"
                    >
                    <label for="remember" class="ml-2 block text-sm text-gray-300">Ingat saya</label>
                </div>
                <a href="#" class="text-sm text-blue-500 hover:text-blue-400">Lupa password?</a>
            </div>
            
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800"
            >
                <span id="btnText">Masuk</span>
                <i id="btnSpinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
            </button>
            
            <div id="errorMessage" class="text-red-500 text-sm text-center hidden py-2 px-3 bg-red-500 bg-opacity-10 rounded-lg"></div>
        </form>
        
        <!-- Footer -->
        <div class="px-6 py-4 bg-gray-700 text-center border-t border-gray-600">
            <p class="text-sm text-gray-400">
                © 2025 AHO. All rights reserved.
                <span class="block mt-1">v2.0.0</span>
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const errorMessage = document.getElementById('errorMessage');
            
            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye text-gray-400 hover:text-gray-300 cursor-pointer"></i>' 
                                                    : '<i class="fas fa-eye-slash text-gray-400 hover:text-gray-300 cursor-pointer"></i>';
            });
            
            // Handle form submission
loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    // Validate inputs
    if (!username || !password) {
        showError('Username dan password harus diisi');
        return;
    }

    // Show loading state
    submitBtn.disabled = true;
    btnText.textContent = 'Memproses...';
    btnSpinner.classList.remove('hidden');

    try {
        // Kirim request ke backend
        const response = await fetch('https://absen.ahoservice.my.id/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
    // Simpan token & data admin ke localStorage
    localStorage.setItem('admin_token', result.token); // <<< TOKEN penting!
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('username', result.admin.username);
    localStorage.setItem('fullName', result.admin.full_name);

            if (remember) {
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('rememberMe');
            }

            // Redirect ke dashboard
            window.location.href = 'index.html';
        } else {
            throw new Error(result.message);
        }

    } catch (error) {
        showError(error.message);
        loginForm.classList.add('shake');
        setTimeout(() => loginForm.classList.remove('shake'), 500);
    } finally {
        // Reset button state
        submitBtn.disabled = false;
        btnText.textContent = 'Masuk';
        btnSpinner.classList.add('hidden');
    }
});
            
            // Show error message
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                setTimeout(() => errorMessage.classList.add('hidden'), 5000);
            }
            
            // Check if remember me was enabled
            if (localStorage.getItem('rememberMe') === 'true') {
                document.getElementById('remember').checked = true;
                const savedUsername = localStorage.getItem('username');
                if (savedUsername) {
                    document.getElementById('username').value = savedUsername;
                    document.getElementById('password').focus();
                }
            }
        });
    </script>
</body>
</html>
