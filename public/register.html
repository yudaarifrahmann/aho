<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .register-container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 28rem;
      border: 1px solid #334155;
    }
    
    .input-field {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    
    .file-input {
      position: relative;
      margin-top: 1rem;
    }
    
    .file-input::file-selector-button {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      margin-right: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .file-input::file-selector-button:hover {
      background-color: #475569;
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    
    .submit-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    
    .form-title {
      position: relative;
      display: inline-block;
    }
    
    .form-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="register-container">
  <h2 class="text-2xl font-bold text-center text-white mb-8 form-title">Register Admin</h2>
  <form id="registerForm" enctype="multipart/form-data" class="space-y-5">
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-300">Nama Lengkap</label>
      <input type="text" id="full_name" name="full_name" placeholder="Masukkan nama lengkap" required 
             class="w-full px-4 py-3 rounded-lg input-field focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-300">Email</label>
      <input type="email" id="email" name="email" placeholder="Masukkan email" required 
             class="w-full px-4 py-3 rounded-lg input-field focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-300">Username</label>
      <input type="text" id="username" name="username" placeholder="Buat username" required 
             class="w-full px-4 py-3 rounded-lg input-field focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    
    <div class="space-y-3 relative">
      <label class="block text-sm font-medium text-gray-300">Password</label>
      <input type="password" id="password" name="password" placeholder="Buat password" required 
             class="w-full px-4 py-3 rounded-lg input-field focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button type="button" class="absolute right-3 top-10 text-gray-400 hover:text-gray-300">
        <i class="far fa-eye"></i>
      </button>
    </div>
    
    <div class="space-y-3">
      <label class="block text-sm font-medium text-gray-300">Foto Profil</label>
      <input type="file" id="photo" name="photo" accept="image/*" 
             class="w-full text-gray-400 file-input focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    
    <button type="submit" class="w-full py-3 px-4 rounded-lg text-white font-medium submit-btn mt-6">
      <i class="fas fa-user-plus mr-2"></i> Daftarkan Admin
    </button>
  </form>
</div>

<script>
  const form = document.getElementById('registerForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalBtnText = submitBtn.innerHTML;
    
    // Show loading state
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
    submitBtn.disabled = true;

    try {
      const response = await fetch('https://absen.ahoservice.my.id/api/register-admin', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.success) {
        // Show success notification
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center animate-fade-in';
        notification.innerHTML = `
          <i class="fas fa-check-circle mr-2"></i>
          <span>Admin berhasil didaftarkan!</span>
        `;
        document.body.appendChild(notification);
        
        // Remove notification after 3 seconds
        setTimeout(() => {
          notification.classList.remove('animate-fade-in');
          notification.classList.add('animate-fade-out');
          setTimeout(() => notification.remove(), 300);
        }, 3000);
        
        form.reset();
      } else {
        alert(result.message || 'Gagal mendaftar.');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('Terjadi kesalahan server.');
    } finally {
      // Reset button state
      submitBtn.innerHTML = originalBtnText;
      submitBtn.disabled = false;
    }
  });

  // Toggle password visibility
  const passwordInput = document.getElementById('password');
  const togglePassword = document.querySelector('.fa-eye').parentNode;
  
  togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    togglePassword.querySelector('i').classList.toggle('fa-eye');
    togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
  });
</script>

</body>
</html>
