<html>
 <head>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md mx-auto p-4">
   <div class="text-center mb-8">
    <div class="flex items-center mb-2">
     <img alt="Logo" class="mr-2" height="50" src="../img/logonew.png" width="50"/>
     <div>
      <h1 class="text-xl font-bold">
       AHO BALANCE
      </h1>
      <p class="text-gray-500">
       Incoming Income
      </p>
     </div>
    </div>
    <hr class="border-gray-300"/>
   </div>
   <div class="text-center mb-8">
    <div class="flex items-center justify-between">
     <div class="text-left">
        <p id="total-income" class="text-4xl font-bold">$0.00</p>
      <p class="text-gray-500 mb-4">
       Total penghasilan AHO
      </p>
     </div>
     <button class="bg-blue-500 text-white px-4 py-2 rounded-full">
      Withdraw
     </button>
    </div>
   </div>
   <div class="bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-center font-bold mb-4">
     Akun Pembayaran Anda
    </h2>
    <div class="mb-4">
     <input class="w-full p-2 border rounded" readonly="" type="text" value="YUDA ARIF RAHMAN"/>
    </div>
    <div class="mb-4">
     <input class="w-full p-2 border rounded" readonly="" type="text" value="1886371638"/>
    </div>
    <div class="mb-4">
     <input class="w-full p-2 border rounded" readonly="" type="text" value="BANK BNI"/>
    </div>
    <div class="flex justify-between">
     <button class="bg-red-500 text-white px-4 py-2 rounded flex items-center">
      <i class="fas fa-trash-alt mr-2">
      </i>
      HAPUS
     </button>
     <button class="bg-blue-100 text-blue-500 px-4 py-2 rounded flex items-center">
      <i class="fas fa-plus-circle mr-2">
      </i>
      TAMBAH
     </button>
    </div>
   </div>
  </div>
  <script>
    async function fetchIncome() {
      try {
        const response = await fetch('https://absen.ahoservice.my.id/total-income');
        const data = await response.json();
        document.getElementById('total-income').innerText = `$${data.totalIncome}`;
      } catch (error) {
        console.error('Error fetching income:', error);
      }
    }
  
    fetchIncome();
  </script>  
 </body>
</html>
