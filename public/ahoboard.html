    <script>
    function redirectToDetail(kelas) {
        let formattedKelas = kelas.replace(/\s+/g, '-');
        window.location.href = `detail.html?kelas=${encodeURIComponent(formattedKelas)}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const tanggalHariIni = new Date().toISOString().split("T")[0];
        
        const kelasList = [
            "X-GIM", "X-RPL-1", "X-RPL-2",
            "XI-GIM", "XI-RPL-1", "XI-RPL-2",
            "XII-PPLG-1", "XII-PPLG-2", "XII-PPLG-3"
        ];

        fetch(`https://absen.ahoservice.my.id/debug/attendance-today`)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                console.log("Data absensi hari ini:", data);
                
                kelasList.forEach(kelas => {
                    const kelasData = data.data.find(item => item.class === kelas) || {
                        hadir: 0,
                        tidak_hadir: 0
                    };
                    
                    const kelasId = kelas.replace(/-/g, '');
                    const hadirEl = document.getElementById(`hadir-${kelasId}`);
                    const tidakHadirEl = document.getElementById(`tidakHadir-${kelasId}`);
                    
                    if (hadirEl && tidakHadirEl) {
                        hadirEl.textContent = kelasData.hadir || 0;
                        tidakHadirEl.textContent = kelasData.tidak_hadir || 0;
                    }
                });
            })
            .catch(error => {
                console.error("Error mengambil data:", error);
                fallbackFetchData(kelasList, tanggalHariIni);
            });
    });

    function fallbackFetchData(kelasList, tanggal) {
        kelasList.forEach(kelas => {
            fetch(`https://absen.ahoservice.my.id/attendance/${kelas}/${tanggal}`)
                .then(response => response.json())
                .then(data => {
                    const kelasId = kelas.replace(/-/g, '');
                    document.getElementById(`hadir-${kelasId}`).textContent = data.hadir || 0;
                    document.getElementById(`tidakHadir-${kelasId}`).textContent = data.tidak_hadir || 0;
                })
                .catch(err => {
                    console.error(`Error untuk kelas ${kelas}:`, err);
                });
        });
    }
    
    setTimeout(function () {
            location.reload();
        }, 10000);
    </script>
